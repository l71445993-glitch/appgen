name: Custom iOS Client Generator
run-name: Custom iOS Client Generator ${{ fromJSON(inputs.zip_url).uuid }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'version to build'
        required: true
        default: '1.4.9'
        type: string
      zip_url:
        description: 'url to zip of json'
        required: true
        default: ''
        type: string

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VERSION: "${{ inputs.version }}"
  UPLOAD_ARTIFACT: 'true'
  STATUS_URL: "${{ secrets.GENURL }}/updategh"

jobs:
  setup:
    uses: ./.github/workflows/fetch-encrypted-secrets.yml
    with:
      zip_url_json: ${{ inputs.zip_url }}

  generate-bridge:
    uses: ./.github/workflows/bridge.yml
    with:
      version: ${{ inputs.version }}

  build-for-ios:
    name: Build iOS unsigned IPA
    needs: [generate-bridge, setup]
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: encrypted-secrets-zip

      - name: Load Secrets
        uses: ./.github/actions/decrypt-secrets
        with:
          zip_password: ${{ secrets.ZIP_PASSWORD }}

      - name: Finalize and Cleanup zip/json
        if: ${{ always() && env.rdgen != 'validation' }}
        continue-on-error: true
        uses: fjogeleit/http-request-action@v1
        with:
          url: "${{ secrets.GENURL }}/cleanzip"
          method: 'POST'
          customHeaders: '{"Content-Type": "application/json", "Authorization": "Bearer ${{ env.token }}"}'
          data: '{"uuid": "${{ env.uuid }}"}'

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Set rdgen status URL
        if: ${{ env.rdgen == 'true' }}
        run: echo "STATUS_URL=${{ secrets.GENURL }}/updategh?signature=${{ env.status_signature }}" >> "$GITHUB_ENV"

      - name: Set api status URL
        if: ${{ env.rdgen == 'false' }}
        run: echo "STATUS_URL=${{ env.apiServer }}/api/updategh" >> "$GITHUB_ENV"

      - name: Checkout rustdesk source
        if: ${{ env.VERSION != 'master' }}
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: refs/tags/${{ env.VERSION }}
          submodules: recursive

      - name: Checkout rustdesk source (master)
        if: ${{ env.VERSION == 'master' }}
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          submodules: recursive

      - name: Install dependencies
        run: brew install nasm yasm

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          set -euo pipefail
          FLUTTER_ROOT="$(dirname "$(dirname "$(which flutter)")")"
          PATCH="${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"
          if [ "3.24.5" = "${{ env.FLUTTER_VERSION }}" ] && [ -f "$PATCH" ]; then
            git -C "$FLUTTER_ROOT" apply "$PATCH" || true
          fi

      - name: Apply white-label branding
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_SUFFIX=$(printf '%s' '${{ env.filename }}' | tr '_' '-' | tr '[:upper:]' '[:lower:]')
          if [ -n "${{ env.iosBundleId }}" ]; then
            IOS_BUNDLE_ID="${{ env.iosBundleId }}"
          else
            IOS_BUNDLE_ID="com.rdgen.${BUNDLE_SUFFIX}"
          fi
          export IOS_BUNDLE_ID
          echo "IOS_BUNDLE_ID=${IOS_BUNDLE_ID}" >> "$GITHUB_ENV"

          # Bundle ID + display name
          sed -i '' -E -e "s|PRODUCT_BUNDLE_IDENTIFIER = [^;]+;|PRODUCT_BUNDLE_IDENTIFIER = ${IOS_BUNDLE_ID};|g" \
            ./flutter/ios/Runner.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName ${{ env.appname }}" ./flutter/ios/Runner/Info.plist || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string ${{ env.appname }}" ./flutter/ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleName ${{ env.appname }}" ./flutter/ios/Runner/Info.plist || true

          if [ "${{ env.appname }}" != "rustdesk" ]; then
            sed -i '' -e 's|description = "RustDesk Remote Desktop"|description = "${{ env.appname }}"|' ./Cargo.toml
            sed -i '' -e 's|ProductName = "RustDesk"|ProductName = "${{ env.appname }}"|' ./Cargo.toml
            find ./src/lang -name "*.rs" -exec sed -i '' -e 's|RustDesk|${{ env.appname }}|g' {} \;
          fi

          if [ -n "${{ env.compname }}" ]; then
            sed -i '' -e 's|Purslane Tech Pte. Ltd.|${{ env.compname }}|g' ./Cargo.toml ./src/main.rs ./flutter/lib/desktop/pages/desktop_setting_page.dart 2>/dev/null || true
            sed -i '' -e 's|Purslane Ltd.|${{ env.compname }}|g' ./Cargo.toml ./src/main.rs 2>/dev/null || true
          fi

          SLOGAN='${{ env.sloganText }}'
          if [ -z "$SLOGAN" ]; then
            SLOGAN="Powered by ${{ env.appname }}"
          fi
          SLOGAN_ESC=$(printf '%s' "$SLOGAN" | sed -e 's/[&|\\]/\\&/g')
          sed -i '' -E -e "s/\(\"Slogan_tip\", \"[^\"]*\"\)/(\"Slogan_tip\", \"${SLOGAN_ESC}\")/" ./src/lang/en.rs || true

          if [ -n "${{ env.urlLink }}" ] && [ "${{ env.urlLink }}" != "https://rustdesk.com" ]; then
            sed -i '' -e "s|https://rustdesk.com|${{ env.urlLink }}|g" ./build.py ./flutter/lib/common.dart \
              ./flutter/lib/desktop/pages/desktop_setting_page.dart \
              ./flutter/lib/mobile/pages/settings_page.dart 2>/dev/null || true
          fi

          sed -i '' -e 's|rs-ny.rustdesk.com|${{ env.server }}|' ./libs/hbb_common/src/config.rs
          sed -i '' -e 's|OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=|${{ env.key }}|' ./libs/hbb_common/src/config.rs
          sed -i '' -e 's|https://admin.rustdesk.com|${{ env.apiServer }}|' ./src/common.rs

          wget -q "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.github/patches/allowCustom.py"
          python3 allowCustom.py
          if [ "${{ env.removeSetupServerTip }}" = "true" ]; then
            wget -q "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.github/patches/remove_setup_server_tip.py"
            python3 remove_setup_server_tip.py
          fi
          if [ "${{ env.hideNetworkSetting }}" = "true" ]; then
            wget -q "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.github/patches/hide_network_setting.py"
            python3 hide_network_setting.py
          fi
          if [ "${{ env.delayFix }}" = "true" ]; then
            wget -q "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.github/patches/delay_fix.py"
            python3 delay_fix.py
          fi
          if [ "${{ env.removeNewVersionNotif }}" = "true" ]; then
            wget -q "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.github/patches/remove_new_version_notif.py"
            python3 remove_new_version_notif.py
          fi
          if [ "${{ env.forceDisableFileTransfer }}" = "true" ]; then
            wget -q "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.github/patches/force_disable_file_transfer.py"
            python3 force_disable_file_transfer.py
          fi

      - name: Apply custom icon
        if: ${{ env.iconlink_url != 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          wget --header="Authorization: Bearer ${{ env.token }}" -T 30 -t 2 \
            -O ./res/icon.png \
            "${{ env.iconlink_url }}/get_png?filename=${{ env.iconlink_file }}&uuid=${{ env.iconlink_uuid }}"
          cp ./res/icon.png ./flutter/assets/icon.png
          pushd flutter
          flutter pub get
          flutter pub run flutter_launcher_icons || true
          popd

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        run: |
          if ! "$VCPKG_ROOT/vcpkg" install --triplet arm64-ios --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
            done
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-ios
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: rustdesk-lib-cache-ios-rdgen
          key: aarch64-apple-ios

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Build rustdesk lib (iOS)
        run: |
          rustup target add aarch64-apple-ios
          cargo build --locked --features flutter,hwcodec --release --target aarch64-apple-ios --lib

      - name: Build unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          pushd flutter
          flutter build ipa --release --no-codesign
          popd
          IPA=$(find ./flutter/build/ios/ipa -type f -name '*.ipa' | head -n 1)
          test -n "$IPA"
          test -s "$IPA"
          cp "$IPA" "./${{ env.filename }}.ipa"
          ls -lh "./${{ env.filename }}.ipa"
          echo "Built unsigned IPA with Bundle ID ${{ env.IOS_BUNDLE_ID }}"

      - name: Upload IPA artifact
        if: env.UPLOAD_ARTIFACT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.filename }}-ios-ipa
          path: ${{ github.workspace }}/${{ env.filename }}.ipa
          if-no-files-found: error
          retention-days: 1

      - name: send IPA to rdgen server
        if: ${{ env.rdgen == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --connect-timeout 30 --max-time 300 --retry 3 --retry-delay 10 -i -X POST \
            -H "Content-Type: multipart/form-data" \
            -H "Authorization: Bearer ${{ env.token }}" \
            -F "file=@${{ github.workspace }}/${{ env.filename }}.ipa" \
            -F "uuid=${{ env.uuid }}" \
            "${{ secrets.GENURL }}/save_custom_client"

      - name: send IPA to api server
        if: ${{ env.rdgen == 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --connect-timeout 30 --max-time 300 --retry 3 --retry-delay 10 -i -X POST \
            -H "Content-Type: multipart/form-data" \
            -H "Authorization: Bearer ${{ env.token }}" \
            -F "file=@${{ github.workspace }}/${{ env.filename }}.ipa" \
            "${{ env.apiServer }}/api/save_custom_client"

  cleanup:
    needs: [build-for-ios]
    runs-on: ubuntu-latest
    continue-on-error: true
    if: ${{ always() }}
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: encrypted-secrets-zip
      - name: Load Secrets
        continue-on-error: true
        uses: ./.github/actions/decrypt-secrets
        with:
          zip_password: ${{ secrets.ZIP_PASSWORD }}
      - name: Report status
        if: ${{ always() && env.rdgen == 'true' }}
        continue-on-error: true
        uses: fjogeleit/http-request-action@v1
        with:
          url: "${{ secrets.GENURL }}/updategh?signature=${{ env.status_signature }}"
          method: 'POST'
          customHeaders: '{"Content-Type": "application/json", "Authorization": "Bearer ${{ env.token }}"}'
          data: '{"uuid": "${{ env.uuid }}", "status": "${{ needs.build-for-ios.result }}"}'
