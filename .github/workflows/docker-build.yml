name: update docker image

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - dev
      - master
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: set docker image tag
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            echo "IMAGE_TAG=dev" >> "$GITHUB_ENV"
            echo "CREATE_IMAGE=true" >> "$GITHUB_ENV"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "IMAGE_TAG=${{ github.ref_name }}" >> "$GITHUB_ENV"
            echo "CREATE_IMAGE=true" >> "$GITHUB_ENV"
          elif [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "IMAGE_TAG=latest" >> "$GITHUB_ENV"
            echo "CREATE_IMAGE=true" >> "$GITHUB_ENV"
          else
            echo "CREATE_IMAGE=false" >> "$GITHUB_ENV"
          fi

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        if: env.CREATE_IMAGE == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        if: env.CREATE_IMAGE == 'true'

      - name: Build and push
        uses: docker/build-push-action@v6
        if: env.CREATE_IMAGE == 'true'
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ env.IMAGE_TAG }}

      - name: Export deployable image
        if: env.CREATE_IMAGE == 'true'
        shell: bash
        run: |
          image="ghcr.io/${{ github.repository }}:${IMAGE_TAG}"
          docker pull "$image"
          docker save "$image" | gzip -9 > rdgen-image.tar.gz
          sha256sum rdgen-image.tar.gz > rdgen-image.tar.gz.sha256

      - name: Upload deployable image
        if: env.CREATE_IMAGE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rdgen-container-${{ env.IMAGE_TAG }}
          path: |
            rdgen-image.tar.gz
            rdgen-image.tar.gz.sha256
          if-no-files-found: error
          retention-days: 3
