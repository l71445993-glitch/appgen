name: Custom Windows Client Generator
run-name: Custom Windows Client Generator ${{ fromJSON(inputs.zip_url).uuid }}
on: 
  workflow_dispatch:
    inputs:
      version:
        description: 'version to buld'
        required: true
        default: '1.4.9'
        type: string
      zip_url:
        description: 'url to zip of json'
        required: true
        default: ''
        type: string


env:
  SCITER_RUST_VERSION: "1.75" # https://github.com/rustdesk/rustdesk/discussions/7503, also 1.78 has ABI change which causes our sciter version not working, https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  RUST_VERSION: "1.75" # sciter failed on m1 with 1.78 because of https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  CARGO_NDK_VERSION: "3.1.2"
  SCITER_ARMV7_CMAKE_VERSION: "3.29.7"
  SCITER_NASM_DEBVERSION: "2.15.05-1"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  ANDROID_FLUTTER_VERSION: "3.24.5" 
  # for arm64 linux because official Dart SDK does not work
  FLUTTER_ELINUX_VERSION: "3.16.9"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  # vcpkg version: 2024.07.12
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  ARMV7_VCPKG_COMMIT_ID: "6f29f12e82a8293156836ad81cc9bf5af41fe836"
  VERSION: "${{ inputs.version }}"
  NDK_VERSION: "r28c"
  #signing keys env variable checks
  ANDROID_SIGNING_KEY: "${{ secrets.ANDROID_SIGNING_KEY }}"
  MACOS_P12_BASE64: "${{ secrets.MACOS_P12_BASE64 }}"
  UPLOAD_ARTIFACT: 'true'
  SIGN_BASE_URL: "${{ secrets.SIGN_BASE_URL }}"
  STATUS_URL: "${{ secrets.GENURL }}/updategh"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"


jobs:
  setup:
    uses: ./.github/workflows/fetch-encrypted-secrets.yml
    with:
      zip_url_json: ${{ inputs.zip_url }}

  generate-bridge:
    uses: ./.github/workflows/bridge.yml
    with:
      version: ${{ inputs.version }}

  build-RustDeskTempTopMostWindow:
    needs: setup
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10
    secrets: inherit
    strategy:
      fail-fast: false

  build-for-windows-flutter:
    name: Build Windows
    needs: [build-RustDeskTempTopMostWindow, generate-bridge, setup]
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          # - { target: i686-pc-windows-msvc        , os: windows-2022                  }
          # - { target: x86_64-pc-windows-gnu       , os: windows-2022                  }
          - {
              target: x86_64-pc-windows-msvc,
              os: windows-2022,
              arch: x86_64,
              vcpkg-triplet: x64-windows-static,
            }
          # - { target: aarch64-pc-windows-msvc, os: windows-2022, arch: aarch64 }
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - uses: actions/download-artifact@v4
        with:
          name: encrypted-secrets-zip

      - name: Load Secrets
        uses: ./.github/actions/decrypt-secrets
        with:
          zip_password: ${{ secrets.ZIP_PASSWORD }}

      - name: Stage smart multi-relay patch bundle
        if: env.smartMultiRelay == 'true'
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'rdgen-smart-multi-relay'
          New-Item -ItemType Directory -Path $bundle -Force | Out-Null
          foreach ($name in @(
            'apply_smart_multi_relay_149.py',
            'smart_multi_relay_149_root.diff',
            'smart_multi_relay_149_hbb_common.diff'
          )) {
            Copy-Item -LiteralPath (Join-Path '.github\patches' $name) -Destination $bundle -Force
          }

      - name: Finalize and Cleanup zip/json
        if: ${{ always() && env.rdgen != 'validation' }}
        continue-on-error: true
        uses: fjogeleit/http-request-action@v1
        with:
          url: "${{ secrets.GENURL }}/cleanzip"
          method: 'POST'
          customHeaders: '{"Content-Type": "application/json", "Authorization": "Bearer ${{ env.token }}"}'
          data: '{"uuid": "${{ env.uuid }}"}'

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      
      - name: Set rdgen value
        if: ${{ env.rdgen == 'true' }}
        run: |
          echo "STATUS_URL=${{ secrets.GENURL }}/updategh?signature=${{ env.status_signature }}" >> $env:GITHUB_ENV

      - name: Set rdgen value
        if: ${{ env.rdgen == 'false' }}
        run: |
          echo "STATUS_URL=${{ env.apiServer }}/api/updategh" >> $env:GITHUB_ENV

      - name: Checkout source code
        if: ${{ env.VERSION != 'master' }}
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: refs/tags/${{ env.VERSION }}
          submodules: recursive

      - name: Checkout source code
        if: ${{ env.VERSION == 'master' }}
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          submodules: recursive

      - name: Apply locked smart multi-relay patch
        if: env.smartMultiRelay == 'true'
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'rdgen-smart-multi-relay'
          python (Join-Path $bundle 'apply_smart_multi_relay_149.py') --enabled true --source . --patches $bundle

      - name: Restore bridge files
        uses: actions/download-artifact@master
        with:
          name: bridge-artifact
          path: ./

      - name: Install ImageMagick on Windows
        run: |
          choco install -y imagemagick.app --no-progress
          Get-ChildItem -Path "${env:ProgramFiles}" | % { $_.FullName } | Select-String -Pattern "[\/\\]ImageMagick[^\/\\]*$" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: fix flutter_gpu_texture_renderer (fixed in master rustdesk)
        shell: bash
        run: |
          sed -i -e 's|2ded7f146437a761ffe6981e2f742038f85ca68d|08a471bb8ceccdd50483c81cdfa8b81b07b14b87|' ./flutter/pubspec.lock
          sed -i -e 's|2ded7f146437a761ffe6981e2f742038f85ca68d|08a471bb8ceccdd50483c81cdfa8b81b07b14b87|' ./flutter/pubspec.yaml
      
      - name: change appname to custom
        if: env.appname != 'rustdesk'
        shell: bash
        run: |
          # ./Cargo.toml
          sed -i -e 's|description = "RustDesk Remote Desktop"|description = "${{ env.appname }}"|' ./Cargo.toml
          sed -i -e 's|ProductName = "RustDesk"|ProductName = "${{ env.appname }}"|' ./Cargo.toml
          sed -i -e 's|FileDescription = "RustDesk Remote Desktop"|FileDescription = "${{ env.appname }}"|' ./Cargo.toml
          sed -i -e 's|OriginalFilename = "rustdesk.exe"|OriginalFilename = "${{ env.appname }}.exe"|' ./Cargo.toml
          # ./libs/portable/Cargo.toml
          sed -i -e 's|description = "RustDesk Remote Desktop"|description = "${{ env.appname }}"|' ./libs/portable/Cargo.toml
          sed -i -e 's|ProductName = "RustDesk"|ProductName = "${{ env.appname }}"|' ./libs/portable/Cargo.toml
          sed -i -e 's|FileDescription = "RustDesk Remote Desktop"|FileDescription = "${{ env.appname }}"|' ./libs/portable/Cargo.toml
          sed -i -e 's|OriginalFilename = "rustdesk.exe"|OriginalFilename = "${{ env.appname }}.exe"|' ./libs/portable/Cargo.toml
          # ./libs/portable/src/main.rs
          sed -i -e 's|const APP_PREFIX: \&str = "rustdesk";|const APP_PREFIX: \&str = "${{ env.appname }}";|' ./libs/portable/src/main.rs
          # ./flutter/windows/runner/Runner.rc
          sed -i -e 's|"RustDesk Remote Desktop"|"${{ env.appname }}"|' ./flutter/windows/runner/Runner.rc
          sed -i -e 's|VALUE "InternalName", "rustdesk" "\0"|VALUE "InternalName", "${{ env.appname }}" "\0"|' ./flutter/windows/runner/Runner.rc
          sed -i -e 's|"rustdesk.exe"|"${{ env.filename }}"|' ./flutter/windows/runner/Runner.rc
          sed -i -e 's|"RustDesk"|"${{ env.appname }}"|' ./flutter/windows/runner/Runner.rc
          # ./src/lang/en.rs
          # change powered by rustdek to powered by compname
          if [ ! -z "${{ env.compname }}" ]; then
            find ./src/lang -name "*.rs" -exec sed -i '/powered_by_me/s|RustDesk|${{ env.compname }}|g' {} \;
          fi
          find ./src/lang -name "*.rs" -exec sed -i -e 's|RustDesk|${{ env.appname }}|' {} \;
          sed -i -e 's|RustDesk|${{ env.appname }}|' ./res/msi/Package/License.rtf

      - name: fix registry if appname has a space
        if: contains(env.appname, ' ')
        continue-on-error: true
        shell: bash
        run: |
          #./src/platform/windows.rs
          sed -i -e 's|reg add {}|reg add \\\"{}\\\"|' ./src/platform/windows.rs
          sed -i -e 's|reg add HKEY_CLASSES_ROOT\\\\.{ext} /f|reg add \\\"HKEY_CLASSES_ROOT\\\\.{ext}\\\" /f|' ./src/platform/windows.rs
          sed -i -e 's|reg add HKEY_CLASSES_ROOT\\\\.{ext}\\\\DefaultIcon /f|reg add \\\"HKEY_CLASSES_ROOT\\\\.{ext}\\\\DefaultIcon\\\" /f|' ./src/platform/windows.rs
          sed -i -e 's|reg add HKEY_CLASSES_ROOT\\\\.{ext}\\\\shell /f|reg add \\\"HKEY_CLASSES_ROOT\\\\.{ext}\\\\shell\\\" /f|' ./src/platform/windows.rs
          sed -i -e 's|reg add HKEY_CLASSES_ROOT\\\\.{ext}\\\\shell\\\\open /f|reg add \\\"HKEY_CLASSES_ROOT\\\\.{ext}\\\\shell\\\\open\\\" /f|' ./src/platform/windows.rs
          sed -i -e 's|reg add HKEY_CLASSES_ROOT\\\\.{ext}\\\\shell\\\\open\\\\command|reg add \\\"HKEY_CLASSES_ROOT\\\\.{ext}\\\\shell\\\\open\\\\command\\\"|' ./src/platform/windows.rs
          sed -i -e 's|reg add HKEY_CLASSES_ROOT\\\\{ext} /f|reg add \\\"HKEY_CLASSES_ROOT\\\\{ext}\\\" /f|' ./src/platform/windows.rs
          sed -i -e 's|reg add HKEY_CLASSES_ROOT\\\\{ext}\\\\shell /f|reg add \\\"HKEY_CLASSES_ROOT\\\\{ext}\\\\shell\\\" /f|' ./src/platform/windows.rs
          sed -i -e 's|reg add HKEY_CLASSES_ROOT\\\\{ext}\\\\shell\\\\open /f|reg add \\\"HKEY_CLASSES_ROOT\\\\{ext}\\\\shell\\\\open\\\" /f|' ./src/platform/windows.rs
          sed -i -e 's|reg add HKEY_CLASSES_ROOT\\\\{ext}\\\\shell\\\\open\\\\command /f|reg add \\\"HKEY_CLASSES_ROOT\\\\{ext}\\\\shell\\\\open\\\\command\\\" /f|' ./src/platform/windows.rs
          sed -i -e 's|{subkey}|\\\"{subkey}\\\"|' ./src/platform/windows.rs
          sed -i -e 's|reg delete HKEY_CLASSES_ROOT\\\\.{ext} /f|reg delete \\\"HKEY_CLASSES_ROOT\\\\.{ext}\\\" /f|' ./src/platform/windows.rs
          sed -i -e 's|reg delete HKEY_CLASSES_ROOT\\\\{ext} /f|reg delete \\\"HKEY_CLASSES_ROOT\\\\{ext}\\\" /f|' ./src/platform/windows.rs
          
      - name: change company name
        if: env.compname != 'Purslane Tech Pte. Ltd.'
        shell: bash
        run: |
          sed -i -e 's|Purslane Tech Pte. Ltd.|${{ env.compname }}|' ./flutter/lib/desktop/pages/desktop_setting_page.dart
          sed -i -e 's|Purslane Tech Pte. Ltd.|${{ env.compname }}|' ./res/msi/preprocess.py
          sed -i -e 's|r"Purslane(?: Tech Pte\\.)? Ltd"|"${{ env.compname }}"|' ./res/msi/preprocess.py
          sed -i -e 's|Purslane Tech Pte. Ltd.|${{ env.compname }}|' ./flutter/windows/runner/Runner.rc
          sed -i -e 's|Purslane Tech Pte. Ltd.|${{ env.compname }}|' ./Cargo.toml
          sed -i -e 's|Purslane Tech Pte. Ltd.|${{ env.compname }}|' ./libs/portable/Cargo.toml
          sed -i -e 's|Purslane Tech Pte. Ltd.|${{ env.compname }}|' ./res/msi/Package/License.rtf
          sed -i -e 's|Purslane Tech Pte. Ltd.|${{ env.compname }}|' ./src/main.rs
          sed -i -e 's|Purslane Ltd|${{ env.compname }}|' ./flutter/lib/desktop/pages/desktop_setting_page.dart
          sed -i -e 's|PURSLANE|${{ env.compname }}|' ./res/msi/preprocess.py
          sed -i -e 's|Purslane Ltd|${{ env.compname }}|' ./res/msi/preprocess.py
          sed -i -e 's|Purslane Ltd|${{ env.compname }}|' ./flutter/windows/runner/Runner.rc
          sed -i -e 's|Purslane Ltd|${{ env.compname }}|' ./Cargo.toml
          sed -i -e 's|Purslane Ltd|${{ env.compname }}|' ./libs/portable/Cargo.toml
          sed -i -e 's|Purslane Ltd|${{ env.compname }}|' ./res/msi/Package/License.rtf
          sed -i -e 's|Purslane Ltd|${{ env.compname }}|' ./src/main.rs
             
      - name: change url to custom
        if: env.urlLink != 'https://rustdesk.com'
        shell: bash
        run: |
          sed -i -e 's|Homepage: https://rustdesk.com|Homepage: ${{ env.urlLink }}|' ./build.py
          sed -i -e "s|launchUrl(Uri.parse('https://rustdesk.com'));|launchUrl(Uri.parse('${{ env.urlLink }}'));|" ./flutter/lib/common.dart
          sed -i -e "s|launchUrlString('https://rustdesk.com');|launchUrlString('${{ env.urlLink }}');|" ./flutter/lib/desktop/pages/desktop_setting_page.dart
          sed -i -e "s|launchUrlString('https://rustdesk.com/privacy.html')|launchUrlString('${{ env.urlLink }}/privacy.html')|" ./flutter/lib/desktop/pages/desktop_setting_page.dart
          sed -i -e "s|const url = 'https://rustdesk.com/';|const url = '${{ env.urlLink }}';|" ./flutter/lib/mobile/pages/settings_page.dart
          sed -i -e "s|launchUrlString('https://rustdesk.com/privacy.html')|launchUrlString('${{ env.urlLink }}/privacy.html')|" ./flutter/lib/mobile/pages/settings_page.dart
          sed -i -e "s|https://rustdesk.com/privacy.html|${{ env.urlLink }}/privacy.html|" ./flutter/lib/desktop/pages/install_page.dart
          sed -i -e "s|rustdesk.com|${{ env.urlLink }}|" ./res/msi/Package/License.rtf

      - name: change download link to custom
        if: env.downloadLink != 'https://rustdesk.com/download'
        shell: bash
        run: |
          sed -i -e 's|https://rustdesk.com/download|${{ env.downloadLink }}|' ./flutter/lib/desktop/pages/desktop_home_page.dart
          sed -i -e 's|https://rustdesk.com/download|${{ env.downloadLink }}|' ./flutter/lib/mobile/pages/connection_page.dart
          sed -i -e 's|https://rustdesk.com/download|${{ env.downloadLink }}|' ./src/ui/index.tis

      - name: set server, key, and apiserver
        shell: bash
        run: |
          sed -i -e 's|rs-ny.rustdesk.com|${{ env.server }}|' ./libs/hbb_common/src/config.rs
          sed -i -e 's|OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=|${{ env.key }}|' ./libs/hbb_common/src/config.rs
          sed -i -e 's|https://admin.rustdesk.com|${{ env.apiServer }}|' ./src/common.rs
          # ./flutter/pubspec.yaml
          #sed -i '/intl:/a \ \ archive: ^3.6.1' ./flutter/pubspec.yaml

      - name: allow custom_.txt
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 1
          max_attempts: 1
          shell: pwsh
          command: |
            Invoke-WebRequest -Uri https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.github/patches/allowCustom.py -OutFile allowCustom.py
            python allowCustom.py
            # Remove Setup Server Tip
            if ("${{ env.removeSetupServerTip }}" -eq "true") {
              Invoke-WebRequest -Uri https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.github/patches/remove_setup_server_tip.py -OutFile remove_setup_server_tip.py
              python remove_setup_server_tip.py
            }

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@v2.12.0 #https://github.com/subosito/flutter-action/issues/277
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # https://github.com/flutter/flutter/issues/155685
      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
            curl -L https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff -o flutter_3.24.4_dropdown_menu_enableFilter.diff
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ matrix.job.os }}

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.job.vcpkg-triplet }}
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet ${{ matrix.job.vcpkg-triplet }} \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log" || true
        shell: bash
          
      - name: magick stuff
        if: ${{ env.iconlink_url != 'false' }}
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 1
          max_attempts: 3
          shell: pwsh
          command: |
            Invoke-WebRequest -Headers @{ Authorization = "Bearer $env:token" } -Uri "${{ env.iconlink_url }}/get_png?filename=${{ env.iconlink_file }}&uuid=${{ env.iconlink_uuid }}" -OutFile ./res/iconx.png
            mv ./res/icon.ico ./res/icon.ico.bak
            mv ./res/icon.png ./res/icon.png.bak
            mv ./res/tray-icon.ico ./res/tray-icon.ico.bak
            mv ./res/iconx.png ./res/icon.png
            mv ./res/32x32.png ./res/32x32.png.bak
            mv ./res/64x64.png ./res/64x64.png.bak
            mv ./res/128x128.png ./res/128x128.png.bak
            mv ./res/128x128@2x.png ./res/128x128@2x.png.bak
            magick ./res/icon.png -define icon:auto-resize=256,64,48,32,16 ./res/icon.ico
            cp ./res/icon.ico ./res/tray-icon.ico
            magick ./res/icon.png -resize 32x32 ./res/32x32.png
            magick ./res/icon.png -resize 64x64 ./res/64x64.png
            magick ./res/icon.png -resize 128x128 ./res/128x128.png
            magick ./res/128x128.png -resize 200% ./res/128x128@2x.png


      - name: ui.rs icon
        if: ${{ env.iconlink_url != 'false' }}
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: |
          cp ./src/ui.rs ./src/ui.rs.bak
          python - <<'PY'
          import base64
          import pathlib
          import re

          ui = pathlib.Path("./src/ui.rs")
          icon = pathlib.Path("./res/128x128.png")
          if not icon.exists():
              icon = pathlib.Path("./res/icon.png")

          b64 = base64.b64encode(icon.read_bytes()).decode("ascii")
          text = ui.read_text(encoding="utf-8")
          pattern = r"iVBORw0KGgoAAAANSUhEUgAAAIAAAACACAYAAADDPmHL[A-Za-z0-9+/=]+"
          updated, count = re.subn(pattern, b64, text)
          if count:
              ui.write_text(updated, encoding="utf-8")
              print(f"Replaced embedded ui.rs icon {count} time(s) using {icon}")
          else:
              print("Default embedded ui.rs icon marker not found; leaving file unchanged")
          PY

      - name: fix connection delay
        if: ${{ env.delayFix == 'true' }}
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.github/patches/delay_fix.py -OutFile delay_fix.py
          python delay_fix.py

      - name: add cycle monitors to toolbar
        if: env.cycleMonitor == 'true'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 1
          max_attempts: 1
          shell: pwsh
          command: |
            Invoke-WebRequest -Uri https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.github/patches/cycle_monitor.py -OutFile cycle_monitor.py
            python cycle_monitor.py

      - name: use X for offline display instead of orange circle
        if: env.xOffline == 'true'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 1
          max_attempts: 1
          shell: pwsh
          command: |
            Invoke-WebRequest -Uri https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.github/patches/xoffline.py -OutFile xoffline.py
            python xoffline.py

      - name: removeNewVersionNotif
        if: env.removeNewVersionNotif == 'true'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 1
          max_attempts: 3
          shell: pwsh
          command: |
            Invoke-WebRequest -Uri https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.github/patches/remove_new_version_notif.py -OutFile remove_new_version_notif.py
            python remove_new_version_notif.py

      - name: hide-cm
        if: env.hidecm == 'true'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 1
          max_attempts: 1
          shell: pwsh
          command: |
            Invoke-WebRequest -Uri https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.github/patches/hidecm.py -OutFile hidecm.py
            python hidecm.py

      - name: hide settings menu
        if: env.hideSettingsMenu == 'true'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 1
          max_attempts: 1
          shell: pwsh
          command: |
            Invoke-WebRequest -Uri https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.github/patches/hide_settings_menu.py -OutFile hide_settings_menu.py
            python hide_settings_menu.py

      - name: hide network setting
        if: env.hideNetworkSetting == 'true'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 1
          max_attempts: 1
          shell: pwsh
          command: |
            Invoke-WebRequest -Uri https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.github/patches/hide_network_setting.py -OutFile hide_network_setting.py
            python hide_network_setting.py

      - name: runtime desktop features
        if: env.copyIdPasswordButton == 'true' || env.manualTemporaryPassword == 'true' || env.showStartOnBootCheckbox == 'true'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 1
          max_attempts: 1
          shell: pwsh
          command: |
            Invoke-WebRequest -Uri https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.github/patches/runtime_features.py -OutFile runtime_features.py
            $featureArgs = @()
            if ("${{ env.copyIdPasswordButton }}" -eq "true") { $featureArgs += "--copy-id-password" }
            if ("${{ env.manualTemporaryPassword }}" -eq "true") { $featureArgs += "--manual-temporary-password" }
            if ("${{ env.showStartOnBootCheckbox }}" -eq "true") { $featureArgs += "--show-start-on-boot" }
            python runtime_features.py @featureArgs

      - name: remove recent sessions
        if: env.removeRecentSessions == 'true'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 1
          max_attempts: 1
          shell: pwsh
          command: |
            Invoke-WebRequest -Uri https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.github/patches/remove_recent_sessions.py -OutFile remove_recent_sessions.py
            python remove_recent_sessions.py

      - name: force disable file transfer
        if: env.forceDisableFileTransfer == 'true'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 1
          max_attempts: 1
          shell: pwsh
          command: |
            Invoke-WebRequest -Uri https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.github/patches/force_disable_file_transfer.py -OutFile force_disable_file_transfer.py
            python force_disable_file_transfer.py

      - name: silent install on double click
        if: env.silentInstallOnDoubleClick == 'true'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 1
          max_attempts: 1
          shell: pwsh
          command: |
            Invoke-WebRequest -Uri https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.github/patches/silent_install.py -OutFile silent_install.py
            python silent_install.py

      - name: silent agent mode
        if: env.silentAgentMode == 'true'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 1
          max_attempts: 1
          shell: pwsh
          command: |
            Invoke-WebRequest -Uri https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.github/patches/silent_agent_mode.py -OutFile silent_agent_mode.py
            python silent_agent_mode.py

      - name: incoming-only compact layout
        if: env.incomingCompactMode == 'true' && env.direction == 'incoming'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 1
          max_attempts: 1
          shell: pwsh
          command: |
            Invoke-WebRequest -Uri https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.github/patches/incoming_compact.py -OutFile incoming_compact.py
            python incoming_compact.py --width "${{ env.incomingContentWidth }}" --height "${{ env.incomingContentHeight }}"

      # - name: run as admin
      #   continue-on-error: true
      #   if: ${{ env.runasadmin == 'true' }}
      #   shell: bash
      #   run: |
      #     sed -i '/<\/compatibility>/a \
      #           <security> \
      #             <requestedExecutionLevel level="requireAdministrator" uiAccess="false"/> \
      #           </security>' ./flutter/windows/runner/runner.exe.manifest

      - name: replace flutter icons
        if: ${{ env.iconlink_url != 'false' }}
        continue-on-error: true
        run: |
          cd ./flutter
          #flutter pub upgrade win32
          flutter pub get
          flutter pub run flutter_launcher_icons
          cd ..

      - name: Validate customization
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.github/patches/validate_customization.py -OutFile validate_customization.py
          python validate_customization.py --platform=windows --server="${{ env.server }}" --key="${{ env.key }}" --api-server="${{ env.apiServer }}" --app-name="${{ env.appname }}" --company="${{ env.compname }}" --url-link="${{ env.urlLink }}" --download-link="${{ env.downloadLink }}"

      - name: Build rustdesk
        run: |
          # Windows: build RustDesk
          python3 .\build.py --portable --hwcodec --flutter --vram --skip-portable-pack
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk
 
          # Download usbmmidd_v2.zip and extract it to ./rustdesk
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath . -Force
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk   

          # Download printer driver files and extract them to ./rustdesk
          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums

            # Check and move the files
            $checksum_driver = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*rustdesk_printer_driver_v4-1.4\.zip$').Matches.Groups[1].Value
            $downloadsum_driver = Get-FileHash -Path rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256
            $checksum_adapter = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*printer_driver_adapter\.zip$').Matches.Groups[1].Value
            $downloadsum_adapter = Get-FileHash -Path printer_driver_adapter.zip -Algorithm SHA256
            if ($checksum_driver -eq $downloadsum_driver.Hash -and $checksum_adapter -eq $downloadsum_adapter.Hash) {
                Write-Output "rustdesk_printer_driver_v4-1.4, checksums match, extract the file."
                Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
                mkdir ./rustdesk/drivers
                mv -Force .\rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver
                Expand-Archive printer_driver_adapter.zip -DestinationPath .
                mv -Force .\printer_driver_adapter.dll ./rustdesk
            } elseif ($checksum_driver -ne $downloadsum_driver.Hash) {
                Write-Output "rustdesk_printer_driver_v4-1.4, checksums do not match, ignore the file."
            } else {
                Write-Output "printer_driver_adapter.dll, checksums do not match, ignore the file."
            }
          } catch {
              Write-Host "Ingore the printer driver error."
          }

      - name: icon stuff
        if: ${{ env.iconlink_url != 'false' }}
        continue-on-error: true
        run: |
          mv ./rustdesk/data/flutter_assets/assets/icon.svg ./rustdesk/data/flutter_assets/assets/icon.svg.bak
          magick ./res/icon.png ./rustdesk/data/flutter_assets/assets/icon.svg

      - name: logo stuff
        if: ${{ env.logolink_url != 'false' }}
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 1
          max_attempts: 3
          shell: pwsh
          continue_on_error: true
          command: |
            Invoke-WebRequest -Headers @{ Authorization = "Bearer $env:token" } -Uri "${{ env.logolink_url }}/get_png?filename=${{ env.logolink_file }}&uuid=${{ env.logolink_uuid }}" -OutFile ./rustdesk/data/flutter_assets/assets/logo.png

      - name: find Runner.res
        # Windows: find Runner.res (compiled from ./flutter/windows/runner/Runner.rc), copy to ./Runner.res
        # Runner.rc does not contain actual version, but Runner.res does
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" == "" ]; then
            echo "Runner.res: not found";
          else
            echo "Runner.res: $runner_res";
            cp $runner_res ./libs/portable/Runner.res;
            echo "list ./libs/portable/Runner.res";
            ls -l ./libs/portable/Runner.res;
          fi

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@master
        if: env.UPLOAD_ARTIFACT == 'true'
        with:
          name: topmostwindow-artifacts
          path: "./rustdesk"
      
      - name: zip dlls
        continue-on-error: true
        shell: pwsh
        run: |
          Compress-Archive -Path ./rustdesk/*.dll, ./rustdesk/*.exe -DestinationPath ./rustdesk/unsigned_files.zip -CompressionLevel Fastest

      - name: sign dlls
        shell: pwsh
        run: |
          if ('${{ secrets.CODE_SIGN_PFX_BASE64 }}' -and '${{ secrets.CODE_SIGN_PFX_PASSWORD }}') {
            $pfxPath = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String('${{ secrets.CODE_SIGN_PFX_BASE64 }}'))
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
              Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
            if (-not $signtool) { throw 'signtool.exe not found' }
            Get-ChildItem ./rustdesk -File | Where-Object { $_.Extension -in '.exe', '.dll' } | ForEach-Object {
              & $signtool sign /f $pfxPath /p '${{ secrets.CODE_SIGN_PFX_PASSWORD }}' /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
              if ($LASTEXITCODE -ne 0) {
                & $signtool sign /f $pfxPath /p '${{ secrets.CODE_SIGN_PFX_PASSWORD }}' /fd SHA256 $_.FullName
              }
              if ($LASTEXITCODE -ne 0) { throw "Failed to sign $($_.FullName)" }
            }
            $signedFiles = Get-ChildItem ./rustdesk -File | Where-Object { $_.Extension -in '.exe', '.dll' }
            Compress-Archive -Path $signedFiles.FullName -DestinationPath ./rustdesk/signed_files.zip -CompressionLevel Fastest -Force
          } elseif ('${{ secrets.SIGN_BASE_URL }}' -and '${{ secrets.SIGN_API_KEY }}') {
            curl.exe --fail --connect-timeout 30 --retry 3 --retry-delay 10 -X POST -F "file=@./rustdesk/unsigned_files.zip" -H "X-API-KEY: ${{ secrets.SIGN_API_KEY }}" -m 900 "${{ secrets.SIGN_BASE_URL }}/sign/" -o ./rustdesk/signed_files.zip
          } else {
            Write-Host 'Signing skipped - no code signing certificate or signing service configured'
            Copy-Item ./rustdesk/unsigned_files.zip ./rustdesk/signed_files.zip -Force
          }

      - name: unzip dlls
        continue-on-error: true
        shell: pwsh
        run: |
          Expand-Archive -Path ./rustdesk/signed_files.zip -DestinationPath ./rustdesk/ -Force
          Remove-Item ./rustdesk/unsigned_files.zip
          Remove-Item ./rustdesk/signed_files.zip

      - name: Create custom_.txt file
        shell: bash
        run: |
          echo -n "${{ env.custom }}" | cat > ./rustdesk/custom_.txt

      - name: Build self-extracted executable
        shell: bash
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          mv "./rustdesk/rustdesk.exe" "./rustdesk/${{ env.appname }}.exe" || echo "rustdesk.exe"
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e "../../rustdesk/${{ env.appname }}.exe"
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe "./SignOutput/rustdesk.exe"

      - name: Configure MSI UTF-8 codepage
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.github/patches/configure_windows_msi_utf8.py -OutFile configure_windows_msi_utf8.py
          python configure_windows_msi_utf8.py

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build msi
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          $myappname = "${{ env.appname }}" -replace '\s','_'
          cp "rustdesk/${{ env.appname }}.exe" "rustdesk/${myappname}.exe" -ErrorAction SilentlyContinue
          pushd ./res/msi
          python preprocess.py --app-name "$myappname" --arp -d ../../rustdesk
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          cp ./Package/bin/x64/Release/en-us/Package.msi ../../SignOutput/rustdesk-latest.msi
          mv ./Package/bin/x64/Release/en-us/Package.msi ../../SignOutput/rustdesk.msi
          sha256sum ../../SignOutput/rustdesk.msi

      - name: zip exe and msi
        shell: pwsh
        run: |
          Compress-Archive -Path ./SignOutput/*.exe, ./SignOutput/*.msi -DestinationPath ./SignOutput/unsigned_files.zip -CompressionLevel Fastest

      - name: sign exe and msi
        shell: pwsh
        run: |
          if ('${{ secrets.CODE_SIGN_PFX_BASE64 }}' -and '${{ secrets.CODE_SIGN_PFX_PASSWORD }}') {
            $pfxPath = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String('${{ secrets.CODE_SIGN_PFX_BASE64 }}'))
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
              Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
            if (-not $signtool) { throw 'signtool.exe not found' }
            Get-ChildItem ./SignOutput -File | Where-Object { $_.Extension -in '.exe', '.msi' } | ForEach-Object {
              & $signtool sign /f $pfxPath /p '${{ secrets.CODE_SIGN_PFX_PASSWORD }}' /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
              if ($LASTEXITCODE -ne 0) {
                & $signtool sign /f $pfxPath /p '${{ secrets.CODE_SIGN_PFX_PASSWORD }}' /fd SHA256 $_.FullName
              }
              if ($LASTEXITCODE -ne 0) { throw "Failed to sign $($_.FullName)" }
            }
            $signedFiles = Get-ChildItem ./SignOutput -File | Where-Object { $_.Extension -in '.exe', '.msi' }
            Compress-Archive -Path $signedFiles.FullName -DestinationPath ./SignOutput/signed_files.zip -CompressionLevel Fastest -Force
          } elseif ('${{ secrets.SIGN_BASE_URL }}' -and '${{ secrets.SIGN_API_KEY }}') {
            curl.exe --fail --connect-timeout 30 --retry 3 --retry-delay 10 -X POST -F "file=@./SignOutput/unsigned_files.zip" -H "X-API-KEY: ${{ secrets.SIGN_API_KEY }}" -m 900 "${{ secrets.SIGN_BASE_URL }}/sign/" -o ./SignOutput/signed_files.zip
          } else {
            Write-Host 'Signing skipped - no code signing certificate or signing service configured'
            Copy-Item ./SignOutput/unsigned_files.zip ./SignOutput/signed_files.zip -Force
          }

      - name: unzip exe and msi
        shell: pwsh
        run: |
          Expand-Archive -Path ./SignOutput/signed_files.zip -DestinationPath ./SignOutput/ -Force
          Remove-Item ./SignOutput/unsigned_files.zip
          Remove-Item ./SignOutput/signed_files.zip

      - name: rename rustdesk.exe to filename.exe
        run: |
          mv ./SignOutput/rustdesk.exe "./SignOutput/${{ env.filename }}.exe" || echo "rustdesk"

      - name: rename rustdesk.msi to filename.msi
        run: |
          mv ./SignOutput/rustdesk.msi "./SignOutput/${{ env.filename }}.msi"

      - name: Upload validation Windows x64 artifacts
        if: ${{ env.rdgen == 'validation' }}
        uses: actions/upload-artifact@v4
        with:
          name: validation-windows-x64
          path: |
            ./SignOutput/${{ env.filename }}.exe
            ./SignOutput/${{ env.filename }}.msi
          if-no-files-found: error
          retention-days: 3

      - name: send exe to rdgen server
        if: ${{ env.rdgen == 'true' }}
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          shell: bash
          command: |
            set -euo pipefail
            test -s "./SignOutput/${{ env.filename }}.exe"
            test -s "./SignOutput/${{ env.filename }}.msi"
            curl --fail --connect-timeout 30 --max-time 300 --retry 3 --retry-delay 10 -i -X POST -H "Content-Type: multipart/form-data" -H "Authorization: Bearer ${{ env.token }}" -F "file=@./SignOutput/${{ env.filename }}.exe" -F "uuid=${{ env.uuid }}" -F "defer_completion=true" ${{ secrets.GENURL }}/save_custom_client

      - name: send msi to rdgen server
        if: ${{ env.rdgen == 'true' }}
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          shell: bash
          command: |
            set -euo pipefail
            test -s "./SignOutput/${{ env.filename }}.msi"
            curl --fail --connect-timeout 30 --max-time 300 --retry 3 --retry-delay 10 -i -X POST -H "Content-Type: multipart/form-data" -H "Authorization: Bearer ${{ env.token }}" -F "file=@./SignOutput/${{ env.filename }}.msi" -F "uuid=${{ env.uuid }}" -F "defer_completion=true" ${{ secrets.GENURL }}/save_custom_client

      - name: finalize files on rdgen server
        if: ${{ env.rdgen == 'true' }}
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          shell: bash
          command: |
            set -euo pipefail
            curl --fail --connect-timeout 30 --max-time 300 --retry 3 --retry-delay 10 -i -X POST -H "Content-Type: application/json" -H "Authorization: Bearer ${{ env.token }}" --data '{"uuid":"${{ env.uuid }}","platform":"windows","filename":"${{ env.filename }}"}' ${{ secrets.GENURL }}/finalize_custom_client

      - name: send file to api server
        if: ${{ env.rdgen == 'false' }}
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          shell: bash
          command: |
            set -euo pipefail
            curl --fail --connect-timeout 30 --max-time 300 --retry 3 --retry-delay 10 -i -X POST -H "Content-Type: multipart/form-data" -H "Authorization: Bearer ${{ env.token }}" -F "file=@./SignOutput/${{ env.filename }}.exe" ${{ env.apiServer }}/api/save_custom_client
            if [[ -f "./SignOutput/${{ env.filename }}.msi" ]]; then
              curl --fail --connect-timeout 30 --max-time 300 --retry 3 --retry-delay 10 -i -X POST -H "Content-Type: multipart/form-data" -H "Authorization: Bearer ${{ env.token }}" -F "file=@./SignOutput/${{ env.filename }}.msi" ${{ env.apiServer }}/api/save_custom_client
            fi

      - name: report generation failure to rdgen server
        if: ${{ always() && env.rdgen == 'true' && !success() }}
        continue-on-error: true
        shell: bash
        run: |
          curl --fail --connect-timeout 30 --max-time 60 --retry 2 --retry-delay 5 -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ env.token }}" \
            --data '{"uuid":"${{ env.uuid }}","status":"failure"}' \
            "${{ secrets.GENURL }}/updategh"

  cleanup:
    needs: [build-for-windows-flutter]
    runs-on: ubuntu-latest
    continue-on-error: true
    if: always()
    steps:
      - name: Delete secrets artifact
        uses: geekyeggo/delete-artifact@v5
        with:
          name: encrypted-secrets-zip

  report-build-failure:
    if: ${{ always() && needs.build-for-windows-flutter.result != 'success' }}
    needs: [setup, generate-bridge, build-RustDeskTempTopMostWindow, build-for-windows-flutter]
    runs-on: ubuntu-latest
    steps:
      - name: report upstream failure to rdgen server
        continue-on-error: true
        shell: python
        env:
          ZIP_URL_JSON: ${{ inputs.zip_url }}
        run: |
          import json
          import os
          import time
          import urllib.request

          metadata = json.loads(os.environ['ZIP_URL_JSON'])
          payload = json.dumps({
              'uuid': metadata['uuid'],
              'status': 'failure',
          }).encode()
          request = urllib.request.Request(
              f"{metadata['url']}/updategh?signature={metadata['status_signature']}",
              data=payload,
              headers={'Content-Type': 'application/json'},
              method='POST',
          )
          for attempt in range(3):
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      assert response.status == 200
                  break
              except Exception:
                  if attempt == 2:
                      raise
                  time.sleep(5 * (attempt + 1))
