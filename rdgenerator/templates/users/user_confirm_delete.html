{% extends "base_account.html" %}

{% block title %}删除账号 | RustDesk 生成器{% endblock %}

{% block content %}
<div class="page-heading">
    <div class="page-heading__copy">
        <span class="eyebrow">ACCESS CONTROL</span>
        <h1>删除账号</h1>
        <p class="page-heading__subtitle">请确认你要永久移除这个工作区账号。</p>
    </div>
</div>
<section class="panel form-panel">
    <p class="form-panel__subtitle">账号 <strong>{{ managed_user.username }}</strong> 删除后将无法登录，账号资料会被永久移除；历史构建记录会保留，但不再关联此账号。此操作不能撤销。</p>
    <form method="post">
        {% csrf_token %}
        <div class="form-actions">
            <button class="button button--danger" type="submit"><i class="fa-solid fa-trash" aria-hidden="true"></i> 确认删除</button>
            <a class="button button--secondary" href="{% url 'users:list' %}"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> 取消</a>
        </div>
    </form>
</section>
{% endblock %}
