services:
  rdgen:
    build:
      context: .
      args:
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.org/simple}"
        PIP_TRUSTED_HOST: "${PIP_TRUSTED_HOST:-}"
    restart: unless-stopped
    environment:
      SECRET_KEY: "${SECRET_KEY}"
      GHUSER: "${GHUSER}"
      GHBEARER: "${GHBEARER}"
      GENURL: "${GENURL}"
      ZIP_PASSWORD: "${ZIP_PASSWORD}"
      GHBRANCH: "${GHBRANCH:-master}"
      PROTOCOL: "${PROTOCOL:-https}"
      REPONAME: "${REPONAME:-rdgen}"
      SH_SECRET: "${SH_SECRET:-}"
      API_SHARED_SECRET: "${API_SHARED_SECRET:-}"
      SQLITE_PATH: "${SQLITE_PATH:-/opt/rdgen/data/db.sqlite3}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1}"
      CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:-}"
      HTTPS_ENABLED: "${HTTPS_ENABLED:-False}"
      SESSION_COOKIE_AGE: "${SESSION_COOKIE_AGE:-28800}"
      SECURE_HSTS_SECONDS: "${SECURE_HSTS_SECONDS:-0}"
      SECURE_HSTS_INCLUDE_SUBDOMAINS: "${SECURE_HSTS_INCLUDE_SUBDOMAINS:-False}"
      SECURE_HSTS_PRELOAD: "${SECURE_HSTS_PRELOAD:-False}"
      EMAIL_BACKEND: "${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}"
      EMAIL_HOST: "${EMAIL_HOST:-smtp.qq.com}"
      EMAIL_PORT: "${EMAIL_PORT:-465}"
      EMAIL_HOST_USER: "${EMAIL_HOST_USER:-}"
      EMAIL_HOST_PASSWORD: "${EMAIL_HOST_PASSWORD:-}"
      EMAIL_USE_SSL: "${EMAIL_USE_SSL:-True}"
      EMAIL_USE_TLS: "${EMAIL_USE_TLS:-False}"
      EMAIL_TIMEOUT: "${EMAIL_TIMEOUT:-10}"
      DEFAULT_FROM_EMAIL: "${DEFAULT_FROM_EMAIL:-}"
      EMAIL_VERIFICATION_CODE_TTL_SECONDS: "${EMAIL_VERIFICATION_CODE_TTL_SECONDS:-300}"
      EMAIL_VERIFICATION_RESEND_SECONDS: "${EMAIL_VERIFICATION_RESEND_SECONDS:-60}"
      EMAIL_VERIFICATION_EMAIL_HOURLY_LIMIT: "${EMAIL_VERIFICATION_EMAIL_HOURLY_LIMIT:-5}"
      EMAIL_VERIFICATION_IP_HOURLY_LIMIT: "${EMAIL_VERIFICATION_IP_HOURLY_LIMIT:-20}"
      EMAIL_VERIFICATION_MAX_ATTEMPTS: "${EMAIL_VERIFICATION_MAX_ATTEMPTS:-5}"
    ports:
      - "127.0.0.1:8000:8000"
    dns:
      - 8.8.8.8
    volumes:
      - ./exe:/opt/rdgen/exe
      - ./png:/opt/rdgen/png
      - ./temp_zips:/opt/rdgen/temp_zips
      - ./data:/opt/rdgen/data
